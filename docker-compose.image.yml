services:
  smtp-relay:
    image: ghcr.io/samirkoirala/send-email:${SMTP_RELAY_VERSION:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - .env
    ports:
      - "${PRIVATE_BIND_IP:-127.0.0.1}:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
