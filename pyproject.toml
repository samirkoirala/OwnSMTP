[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smtp-relay-api"
version = "1.1.0"
description = "A small authenticated HTTP-to-SMTP relay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SMTP Relay API contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
]
dependencies = [
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "pydantic[email]==2.13.5",
  "python-dotenv==1.1.1",
  "uvicorn==0.53.0",
]

[project.urls]
Documentation = "https://github.com/samirkoirala/send-email#readme"
Issues = "https://github.com/samirkoirala/send-email/issues"

[tool.setuptools.packages.find]
include = ["email_gateway*"]

[tool.setuptools.package-data]
email_gateway = ["web/*.html", "web/*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["email_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI dependencies are intentionally declared in defaults.

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["email_gateway"]
