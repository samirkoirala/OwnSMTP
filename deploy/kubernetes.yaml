apiVersion: v1
kind: Secret
metadata:
  name: smtp-relay-secrets
type: Opaque
stringData:
  API_KEY: replace-with-output-of-openssl-rand-hex-32
  SMTP_USERNAME: no-reply@yourdomain.com
  SMTP_PASSWORD: replace-with-an-app-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smtp-relay-config
data:
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_AUTH: "true"
  SMTP_FROM_EMAIL: no-reply@yourdomain.com
  SMTP_FROM_NAME: Your Company
  ALLOWED_FROM_DOMAINS: yourdomain.com
  SMTP_SECURITY: starttls
  SMTP_TIMEOUT_SECONDS: "15"
  DISABLE_DOCS: "true"
  LOG_LEVEL: INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
  labels:
    app.kubernetes.io/name: smtp-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smtp-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smtp-relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smtp-relay
          image: ghcr.io/samirkoirala/send-email:1.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: smtp-relay-config
            - secretRef:
                name: smtp-relay-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smtp-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smtp-relay
  ports:
    - name: http
      port: 8000
      targetPort: http
